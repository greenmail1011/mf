<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無人機抽籤對號台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
</head>
<body>
<style>
  :root{
    --sky:#eaf4ff; --paper:#ffffff;
    --ink:#11243b; --ink-2:#4a627c; --ink-3:#8ba0b6;
    --line:#cfe1f5;
    --blue:#1a72e8;
    --sun:#ffc53d; --sun-soft:#fff4d6;
    --coral:#ff6a52; --coral-soft:#ffe8e3;
    --mint:#12b886; --mint-soft:#dff7ee;
    --shadow:0 2px 0 var(--line), 0 12px 28px -18px rgba(17,36,59,.5);
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink);
    background:radial-gradient(1100px 480px at 12% -12%, #fff 0%, rgba(255,255,255,0) 62%), var(--sky);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:24px 18px 72px; display:flex; flex-direction:column; gap:16px}

  header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px}
  .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em; color:var(--ink-3)}
  h1{
    margin:2px 0 0; font-family:"Baloo 2","Noto Sans TC",sans-serif; font-weight:800;
    font-size:clamp(26px,4vw,38px); line-height:1.15; text-wrap:balance;
  }
  h1 .hl{background:linear-gradient(transparent 62%, var(--sun) 62%, var(--sun) 92%, transparent 92%); padding:0 2px}
  .sub{color:var(--ink-2); font-size:13.5px; margin-top:2px}
  .status{
    font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2);
    display:flex; align-items:center; gap:7px; background:var(--paper);
    border:1px solid var(--line); border-radius:999px; padding:5px 12px;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex:none}
  .dot.live{background:var(--mint)} .dot.off{background:var(--coral)}

  /* ---------- 抽籤舞台 ---------- */
  .stage{
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
    background:linear-gradient(180deg,#fff, #f6fbff);
    border:2px solid var(--line); border-radius:20px; padding:18px 22px; box-shadow:var(--shadow);
  }
  .stage.live{border-color:var(--sun); background:linear-gradient(180deg,#fff, var(--sun-soft))}
  .stage.hit{border-color:var(--mint); background:linear-gradient(180deg,#fff, var(--mint-soft))}
  .stageName{
    font-family:"Baloo 2","Noto Sans TC",sans-serif; font-weight:800;
    font-size:clamp(26px,4.6vw,40px); line-height:1.15;
  }
  .stageMeta{color:var(--ink-2); font-size:13px; font-family:"IBM Plex Mono",monospace}
  .reel{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(56px,11vw,96px); line-height:1; letter-spacing:-.05em; color:var(--ink-3);
    min-width:2.6ch; text-align:center; transition:color .15s;
  }
  .stage.live .reel{color:#b06a00}
  .stage.hit .reel{color:var(--mint); animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes slam{0%{transform:scale(1.5); opacity:.3} 60%{transform:scale(.94)} 100%{transform:scale(1)}}
  .reelLabel{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em; color:var(--ink-3); text-align:center}

  .bar{display:flex; flex-wrap:wrap; align-items:center; gap:9px}
  button, input{font:inherit}
  .act{
    cursor:pointer; border-radius:12px; padding:9px 16px; color:var(--ink); font-weight:500;
    border:1px solid var(--line); background:var(--paper);
    box-shadow:0 2px 0 var(--line); transition:transform .1s, box-shadow .1s;
  }
  .act:hover{transform:translateY(-1px)}
  .act:active{transform:translateY(1px); box-shadow:none}
  .act.primary{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; box-shadow:0 3px 0 #0f56b4; padding:10px 22px}
  .act.primary:active{box-shadow:0 1px 0 #0f56b4}
  .act.primary.stop{background:var(--coral); border-color:var(--coral); box-shadow:0 3px 0 #cc4530; animation:breathe 1s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)} 50%{transform:scale(1.04)}}
  .slot.spot{border-color:var(--sun); background:linear-gradient(var(--paper),var(--sun-soft)); box-shadow:0 0 0 3px rgba(255,197,61,.45), var(--shadow)}
  .act:disabled{opacity:.5; cursor:not-allowed; transform:none}
  .spacer{flex:1}
  :is(button,input,.slot,.chip):focus-visible{outline:3px solid var(--sun); outline-offset:2px}
  .counts{display:flex; gap:14px; font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-2); align-items:center; flex-wrap:wrap}
  .counts b{color:var(--ink); font-size:15px}

  /* ---------- 機位 ---------- */
  .hangar{display:grid; grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); gap:11px}
  .slot{
    position:relative; text-align:left; cursor:pointer; background:var(--paper);
    border:1.5px solid var(--line); border-radius:16px; padding:12px 13px 13px;
    display:flex; flex-direction:column; gap:9px; box-shadow:var(--shadow);
    transition:transform .12s, border-color .12s;
  }
  .slot:hover{transform:translateY(-2px)}
  .slot .tag{
    font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-3);
    display:flex; justify-content:space-between; align-items:center; gap:6px; min-height:16px;
  }
  .slot .no{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:34px; line-height:1;
    letter-spacing:-.03em; font-variant-numeric:tabular-nums;
  }
  .slot .who{min-height:44px; display:flex; flex-direction:column; justify-content:flex-end; gap:1px}
  .slot .name{font-weight:700; font-size:17px}
  .slot .meta{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
  .slot.filled{border-color:var(--mint); background:linear-gradient(var(--paper),var(--mint-soft))}
  .slot.filled .tag{color:var(--mint)}
  .slot.empty .name{color:var(--coral); font-weight:500; font-size:15px}
  .slot.armed{border-color:var(--blue); box-shadow:0 0 0 3px rgba(26,114,232,.2), var(--shadow)}
  .slot.cand{border-color:var(--sun); background:linear-gradient(var(--paper),var(--sun-soft))}
  .slot.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.8) rotate(-3deg)} 60%{transform:scale(1.07) rotate(1.5deg)} 100%{transform:scale(1)}}
  .slot.spare{border-style:dashed}
  .spareInput{
    width:100%; border:none; border-bottom:2px dashed var(--line); background:transparent;
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:30px; color:var(--ink);
    padding:0 0 2px; letter-spacing:-.03em;
  }
  .spareInput::placeholder{color:var(--ink-3)}
  .drawing .slot{cursor:default}
  .pin{color:#b06a00; background:var(--sun-soft); border-radius:999px; padding:0 7px;
       font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em}

  /* ---------- 名單 ---------- */
  .panel{
    background:var(--paper); border:1.5px solid var(--line); border-radius:16px;
    padding:14px 16px; display:flex; flex-direction:column; gap:11px; box-shadow:var(--shadow);
  }
  .panel h2{margin:0; font-family:"Baloo 2","Noto Sans TC",sans-serif; font-size:17px; font-weight:700; display:flex; align-items:baseline; gap:9px}
  .panel h2 em{font-style:normal; font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3)}
  .hint{color:var(--ink-3); font-size:12.5px}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{
    cursor:pointer; border-radius:999px; padding:5px 13px 5px 7px; color:var(--ink); font-weight:500;
    border:1.5px solid var(--line); background:var(--paper); display:flex; align-items:center; gap:8px;
  }
  .chip .seq{
    font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-2);
    background:var(--sky); border-radius:999px; padding:1px 7px; min-width:26px; text-align:center;
  }
  .chip:hover{border-color:var(--blue)}
  .chip.absent{background:var(--coral-soft); border-color:var(--coral); color:#a33421; text-decoration:line-through}
  .chip.seated{border-color:var(--mint); background:var(--mint-soft)}
  .chip.pick{border-color:var(--blue); box-shadow:0 0 0 3px rgba(26,114,232,.18)}
  .chip.now{border-color:var(--sun); background:var(--sun-soft)}
  footer{color:var(--ink-3); font-size:12px; text-align:center}
  @media (prefers-reduced-motion: reduce){
    .slot.pop,.stage.hit .reel,.act.primary.stop{animation:none}
    .act:hover,.slot:hover{transform:none}
  }
  @media print{
    .bar,.hint,footer,.status,.stage,#rosterPanel{display:none}
    body{background:#fff} .slot{box-shadow:none}
  }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">民富國小 115 學年上學期 · AI 無人機足球</div>
      <h1>無人機<span class="hl">抽籤對號</span>台</h1>
      <div class="sub">依名單序號一位一位上台（可切成隨機）。按一下開始滾號碼，什麼時候停由你決定。</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">連線中…</span></div>
  </header>

  <div class="stage" id="stage">
    <div>
      <div class="eyebrow">現在抽籤</div>
      <div class="stageName" id="stageName">準備開始</div>
      <div class="stageMeta" id="stageMeta">按「抽下一位」開始滾動，再按「停！」定格（也可用空白鍵）</div>
    </div>
    <div>
      <div class="reel" id="reel">––</div>
      <div class="reelLabel">機號</div>
    </div>
  </div>

  <div class="bar">
    <button class="act primary" id="nextBtn">抽下一位</button>
    <button class="act" id="orderBtn">順序：名單</button>
    <button class="act" id="clearBtn">重新開始</button>
    <button class="act" id="soundBtn" aria-pressed="true">🔊 音效開</button>
    <span class="spacer"></span>
    <div class="counts">
      <span>待抽 <b id="cLeft">–</b></span>
      <span>已對號 <b id="cSeated">–</b></span>
      <span>剩餘機位 <b id="cFree">–</b></span>
    </div>
    <button class="act" id="csvBtn">匯出 CSV</button>
    <button class="act" id="printBtn">列印</button>
  </div>

  <div class="hangar" id="hangar"></div>

  <div class="panel" id="rosterPanel">
    <h2>學生名單 <em id="rosterCount"></em></h2>
    <div class="chips" id="roster"></div>
    <div class="hint">點名字可切換 <b>出席 / 請假</b>（請假的不參加抽籤）。鍾宇硯固定使用預備機。手動指派：先點機位，再點學生。名單順序＝依序號 1→16。</div>
  </div>

  <footer>抽籤結果會存在這個頁面，關掉再打開仍在。</footer>
</div>

<script>
(function(){
  "use strict";

  const MAIN = [58,59,60,61,62,63,64,65,70,94,95,96,97,98];
  const SLOTS = MAIN.map(n => ({ key:"d"+n, no:String(n), spare:false }))
    .concat([{ key:"s1", no:"", spare:true }, { key:"s2", no:"", spare:true }]);

  const STUDENTS = [
    {seq:1, cls:"304", name:"蕭豋翰"},  {seq:2, cls:"610", name:"楊苡禾"},
    {seq:3, cls:"506", name:"楊宸豪"},  {seq:4, cls:"310", name:"林克軒"},
    {seq:5, cls:"610", name:"劉軒廷"},  {seq:6, cls:"508", name:"楊翊僑"},
    {seq:7, cls:"303", name:"楊軒凱"},  {seq:8, cls:"510", name:"陳亮"},
    {seq:9, cls:"607", name:"楊景閎"},  {seq:10, cls:"410", name:"郭承晏"},
    {seq:11, cls:"309", name:"鄭開駿"}, {seq:12, cls:"302", name:"許煒丞"},
    {seq:13, cls:"407", name:"陳奕瑋"}, {seq:14, cls:"502", name:"許桓與"},
    {seq:15, cls:"406", name:"鍾宇硯"}, {seq:16, cls:"311", name:"張碩"}
  ];
  const byId = {}; STUDENTS.forEach(s => byId[s.seq] = s);
  const slotByKey = {}; SLOTS.forEach(sl => slotByKey[sl.key] = sl);

  const state = {
    assign: {},                  // slotKey -> seq
    absent: { 16: true },        // 張碩預設請假
    pinned: { 15: "s1" },        // 鍾宇硯固定用預備機
    spareNo: { s1:"", s2:"" },
    armed: null, drawing: false, sound: true, now: null, db: null,
    order: "list"               // list = 依名單序號；random = 隨機叫人
  };

  const $ = id => document.getElementById(id);
  const el = {
    hangar:$("hangar"), roster:$("roster"), rosterCount:$("rosterCount"),
    dot:$("dot"), statusText:$("statusText"),
    stage:$("stage"), stageName:$("stageName"), stageMeta:$("stageMeta"), reel:$("reel"),
    nextBtn:$("nextBtn"), clearBtn:$("clearBtn"), soundBtn:$("soundBtn"), orderBtn:$("orderBtn"),
    cLeft:$("cLeft"), cSeated:$("cSeated"), cFree:$("cFree")
  };

  const present = () => STUDENTS.filter(s => !state.absent[s.seq]);
  const seatedSeqs = () => new Set(Object.values(state.assign).map(Number));
  const slotLabel = sl => sl.spare ? (state.spareNo[sl.key] || "預備") : sl.no;
  const pinnedSlotOf = seq => state.pinned[seq] || null;
  function pinnedSeqOf(key){
    const hit = Object.keys(state.pinned).find(q => state.pinned[q] === key);
    return hit ? Number(hit) : null;
  }
  const waiting = () => {
    const seated = seatedSeqs();
    return present().filter(s => !seated.has(s.seq));
  };
  const freeSlots = () => SLOTS.filter(sl => !state.assign[sl.key]);
  // 編號機優先，發完才用預備機
  function candidateSlots(){
    const free = freeSlots();
    const mains = free.filter(sl => !sl.spare);
    return mains.length ? mains : free;
  }

  /* ---------- 音效 ---------- */
  let ac = null;
  function beep(freq, dur, type, vol, at){
    if(!state.sound) return;
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + (at || 0);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    }catch(e){}
  }
  const tick = () => beep(1180, 0.03, "square", 0.035);
  function fanfare(){
    [[659,0],[880,0.09],[1319,0.19]].forEach(([f,d]) => beep(f, 0.28, "triangle", 0.11, d));
  }
  function finale(){
    [523,659,784,1047,1319].forEach((f,i) => beep(f, 0.34, "triangle", 0.1, i * 0.11));
  }

  /* ---------- 保存 ---------- */
  const body = () => ({ assign:state.assign, absent:state.absent, pinned:state.pinned,
                        spareNo:state.spareNo, updatedAt:new Date().toISOString() });
  function save(){
    try{ localStorage.setItem("droneDraw2", JSON.stringify(body())); }catch(e){}
    if(state.db) state.db.doc("draw/term").set(body()).catch(() => setStatus(false, "暫時無法保存"));
  }
  function setStatus(live, text){
    el.dot.className = "dot " + (live ? "live" : "off");
    el.statusText.textContent = text;
  }
  function applyPinned(){
    Object.keys(state.pinned).forEach(q => {
      const seq = Number(q), key = state.pinned[q];
      if(state.absent[seq]) return;
      Object.keys(state.assign).forEach(k => {
        if(Number(state.assign[k]) === seq && k !== key) delete state.assign[k];
      });
      state.assign[key] = seq;
    });
  }
  function load(b){
    if(!b) return;
    state.assign = b.assign || {};
    state.absent = b.absent || {};
    state.spareNo = Object.assign({s1:"", s2:""}, b.spareNo || {});
    if(b.pinned) state.pinned = b.pinned;
    applyPinned();
  }
  try{ load(JSON.parse(localStorage.getItem("droneDraw2"))); }catch(e){}

  /* ---------- 畫面 ---------- */
  function renderHangar(candKeys, popKey, spotKey){
    el.hangar.innerHTML = "";
    SLOTS.forEach(sl => {
      const seq = state.assign[sl.key], s = seq ? byId[seq] : null;
      const pinHere = pinnedSeqOf(sl.key);
      const d = document.createElement("div");
      d.className = "slot" + (sl.spare ? " spare" : "") + (s ? " filled" : " empty") +
        (state.armed === sl.key ? " armed" : "") +
        (candKeys && candKeys.has(sl.key) ? " cand" : "") +
        (popKey === sl.key ? " pop" : "") +
        (spotKey === sl.key ? " spot" : "");
      d.tabIndex = 0;
      d.innerHTML =
        '<div class="tag"><span>' + (sl.spare ? "預備機" : "機號") + '</span>' +
          (pinHere && !state.absent[pinHere] ? '<span class="pin">固定</span>' : (s ? "<span>✓</span>" : "")) +
        '</div>' +
        (sl.spare
          ? '<input class="spareInput" value="' + (state.spareNo[sl.key] || "") + '" placeholder="編號" maxlength="4" data-spare="' + sl.key + '" aria-label="預備機編號">'
          : '<span class="no">' + sl.no + '</span>') +
        '<div class="who">' + (s
          ? '<span class="name">' + s.name + '</span><span class="meta">' + s.cls + ' · 序號 ' + s.seq + '</span>'
          : '<span class="name">尚未對號</span><span class="meta">點此指派</span>') + '</div>';
      d.onclick = ev => {
        if(state.drawing || ev.target.classList.contains("spareInput")) return;
        if(pinHere && !state.absent[pinHere]) return;
        if(state.assign[sl.key]){ delete state.assign[sl.key]; state.armed = null; save(); render(); }
        else { state.armed = (state.armed === sl.key ? null : sl.key); render(); }
      };
      el.hangar.appendChild(d);
    });
    el.hangar.querySelectorAll(".spareInput").forEach(inp => {
      inp.oninput = () => { state.spareNo[inp.dataset.spare] = inp.value.trim(); save(); };
    });
  }

  function renderRoster(){
    const seated = seatedSeqs();
    el.roster.innerHTML = "";
    el.rosterCount.textContent = present().length + " 人出席 / 共 " + STUDENTS.length + " 人";
    STUDENTS.forEach(s => {
      const absent = !!state.absent[s.seq];
      const c = document.createElement("button");
      c.className = "chip" + (absent ? " absent" : (seated.has(s.seq) ? " seated" : "")) +
        (state.now === s.seq ? " now" : "") +
        (state.armed && !absent && !seated.has(s.seq) ? " pick" : "");
      c.innerHTML = '<span class="seq">' + s.seq + '</span>' + s.name +
        '<span class="seq">' + s.cls + '</span>' +
        (pinnedSlotOf(s.seq) ? '<span class="seq pin">預備機</span>' : '');
      c.onclick = () => {
        if(state.drawing) return;
        if(pinnedSlotOf(s.seq) && !absent){ state.armed = null; render(); return; }
        if(state.armed && !absent && !seated.has(s.seq)){
          state.assign[state.armed] = s.seq; state.armed = null; save(); render(); return;
        }
        if(absent) delete state.absent[s.seq];
        else{
          state.absent[s.seq] = true;
          Object.keys(state.assign).forEach(k => { if(Number(state.assign[k]) === s.seq) delete state.assign[k]; });
        }
        save(); render();
      };
      el.roster.appendChild(c);
    });
  }

  function renderCounts(){
    const left = waiting().length;
    el.cLeft.textContent = left;
    el.cSeated.textContent = seatedSeqs().size;
    el.cFree.textContent = freeSlots().length;
    if(spinTimer) return;
    el.nextBtn.disabled = state.drawing || left === 0 || freeSlots().length === 0;
    const nxt = state.order === "list" ? waiting()[0] : null;
    el.nextBtn.textContent = left === 0 ? "全部抽完了"
      : (nxt ? "抽下一位：" + nxt.name : "抽下一位");
  }

  function render(candKeys, popKey){
    renderHangar(candKeys, popKey); renderRoster(); renderCounts();
  }

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- 一位一位抽：按一下開始跑，再按一下停 ---------- */
  let spinTimer = null, curCand = null, curStudent = null, curCands = null;

  function startSpin(){
    const pool = waiting(), cands = candidateSlots();
    if(!pool.length || !cands.length) return;

    state.drawing = true;
    document.body.classList.add("drawing");
    curStudent = (state.order === "list") ? pool[0] : pick(pool);
    curCands = cands;
    state.now = curStudent.seq;

    el.stage.classList.remove("hit");
    el.stage.classList.add("live");
    el.stageName.textContent = curStudent.name;
    el.stageMeta.textContent = curStudent.cls + " · 序號 " + curStudent.seq +
      (cands[0].spare ? " · 抽預備機" : " · 按「停！」定格");
    el.nextBtn.textContent = "停！";
    el.nextBtn.classList.add("stop");
    renderHangar(new Set(cands.map(c => c.key)), null, cands.length ? null : null);
    renderRoster();

    spinTimer = setInterval(() => {
      curCand = pick(curCands);
      el.reel.textContent = slotLabel(curCand) || "預備";
      renderHangar(new Set(curCands.map(c => c.key)), null, curCand.key);
      tick();
    }, 75);
  }

  async function stopSpin(){
    if(!spinTimer) return;
    clearInterval(spinTimer); spinTimer = null;
    el.nextBtn.disabled = true;

    // 收尾：再跳幾格，越跳越慢
    let delay = 90;
    for(let i = 0; i < 5; i++){
      curCand = pick(curCands);
      el.reel.textContent = slotLabel(curCand) || "預備";
      renderHangar(new Set(curCands.map(c => c.key)), null, curCand.key);
      tick();
      await wait(delay);
      delay += 85;
    }

    const target = curCand || pick(curCands);
    state.assign[target.key] = curStudent.seq;
    el.reel.textContent = slotLabel(target) || "預備";
    state.now = null;
    el.stage.classList.remove("live");
    el.stage.classList.add("hit");
    el.stageMeta.textContent = curStudent.name + " → " +
      (target.spare ? "預備機 " + (state.spareNo[target.key] || "") : target.no + " 號");
    fanfare();

    state.drawing = false;
    document.body.classList.remove("drawing");
    el.nextBtn.classList.remove("stop");
    el.nextBtn.disabled = false;
    save(); render(null, target.key);

    if(!waiting().length){
      el.stageName.textContent = "抽籤完成";
      el.stageMeta.textContent = "共 " + seatedSeqs().size + " 位對號完成";
      await wait(120); finale();
    }
    curCand = null; curStudent = null; curCands = null;
  }

  el.nextBtn.onclick = () => { if(spinTimer) stopSpin(); else startSpin(); };
  window.addEventListener("keydown", e => {
    if(e.code === "Space" && !e.target.matches("input")){
      e.preventDefault();
      if(spinTimer) stopSpin(); else if(!state.drawing) startSpin();
    }
  });
  el.clearBtn.onclick = () => {
    if(spinTimer){ clearInterval(spinTimer); spinTimer = null; state.drawing = false;
      document.body.classList.remove("drawing"); el.nextBtn.classList.remove("stop"); }
    if(state.drawing) return;
    state.assign = {}; state.armed = null; state.now = null;
    applyPinned(); save(); render();
    el.stage.className = "stage";
    el.stageName.textContent = "準備開始";
    el.stageMeta.textContent = "按「抽下一位」開始滾動，再按「停！」定格（也可用空白鍵）";
    el.reel.textContent = "––";
  };
  el.orderBtn.onclick = () => {
    if(state.drawing) return;
    state.order = state.order === "list" ? "random" : "list";
    el.orderBtn.textContent = state.order === "list" ? "順序：名單" : "順序：隨機";
    try{ localStorage.setItem("droneDrawOrder", state.order); }catch(e){}
    renderCounts();
  };
  el.soundBtn.onclick = () => {
    state.sound = !state.sound;
    el.soundBtn.setAttribute("aria-pressed", String(state.sound));
    el.soundBtn.textContent = state.sound ? "🔊 音效開" : "🔇 音效關";
    if(state.sound) beep(880, 0.08, "triangle", 0.08);
  };
  $("printBtn").onclick = () => window.print();
  $("csvBtn").onclick = async () => {
    let csv = "﻿機號,類別,學生序號,班級,姓名,備註\n";
    SLOTS.forEach(sl => {
      const s = byId[state.assign[sl.key]], pinHere = pinnedSeqOf(sl.key);
      csv += [slotLabel(sl), sl.spare ? "預備機" : "主機", s ? s.seq : "", s ? s.cls : "",
              s ? s.name : "（空）", (s && pinHere === Number(s.seq)) ? "固定" : ""].join(",") + "\n";
    });
    STUDENTS.filter(s => state.absent[s.seq]).forEach(s => {
      csv += ["", "請假", s.seq, s.cls, s.name, ""].join(",") + "\n";
    });
    const dl = await window.claude.use("downloads").catch(() => null);
    if(dl){ try{ await dl.save({ filename:"無人機對號表.csv", data:csv }); }catch(e){} }
    else{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
      a.download = "無人機對號表.csv"; a.click();
    }
  };

  try{ state.order = localStorage.getItem("droneDrawOrder") || "list"; }catch(e){}
  el.orderBtn.textContent = state.order === "list" ? "順序：名單" : "順序：隨機";
  applyPinned();
  render();
  if(!waiting().length && seatedSeqs().size){
    el.stage.classList.add("hit");
    el.stageName.textContent = "抽籤完成";
    el.stageMeta.textContent = "共 " + seatedSeqs().size + " 位對號完成";
    el.reel.textContent = "✓";
  }
  setStatus(false, "本機暫存");

  (async function(){
    let db = null;
    try{ db = await window.claude.use("db"); }catch(e){}
    if(!db){ setStatus(false, "本機暫存（此裝置）"); return; }
    state.db = db;
    setStatus(true, "已保存");
    db.doc("draw/term").onSnapshot(
      snap => { if(!state.drawing && snap.exists){ load(snap.data()); render(); } },
      () => setStatus(false, "同步中斷，改用本機暫存")
    );
  })();
})();
</script>

</body>
</html>
